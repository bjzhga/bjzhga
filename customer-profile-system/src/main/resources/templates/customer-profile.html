<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>客户画像详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1><span th:text="${customer.name}">张三</span> 的客户画像</h1>
        <a href="/customers" class="btn btn-secondary">返回列表</a>
    </div>

    <div class="row">
        <!-- 左侧基础信息 -->
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header fw-bold">基础信息</div>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item"><b>客户编号:</b> <span th:text="${customer.customerNo}"></span></li>
                    <li class="list-group-item"><b>手机号:</b> <span th:text="${customer.phone}"></span></li>
                    <li class="list-group-item"><b>学历:</b> <span th:text="${customer.education}"></span></li>
                    <li class="list-group-item"><b>年收入:</b> <span th:text="${customer.annualIncome}"></span> 万</li>
                    <li class="list-group-item"><b>总资产:</b> <span th:text="${customer.assetScale}"></span> 万</li>
                    <li class="list-group-item"><b>投资经验:</b> <span th:text="${customer.investmentExperience}"></span> 年</li>
                    <li class="list-group-item"><b>风险等级:</b> <span th:text="${customer.riskProfile?.riskLevel}" class="badge bg-danger">C3</span></li>
                </ul>
            </div>
        </div>

        <!-- 右侧画像标签 -->
        <div class="col-md-6">
            <div class="card mb-4">
                <div class="card-header fw-bold">画像标签</div>
                <div class="card-body">
                    <th:block th:each="tag : ${customer.tags}" th:if="${!#strings.startsWith(tag.tagName, '投资摘要:')}">
                         <span class="badge me-2"
                               th:classappend="${tag.tagSource == 'RULE'} ? 'bg-primary' : (${tag.tagSource == 'ALGORITHM'} ? 'bg-success' : 'bg-warning text-dark')"
                               th:text="${tag.tagName}">
                         </span>
                    </th:block>
                </div>
            </div>

            <!-- LLM 摘要 -->
            <div class="card mb-4">
                <div class="card-header fw-bold">大模型投资风格摘要 (LLM)</div>
                <div class="card-body">
                    <p class="card-text" th:each="tag : ${customer.tags}" th:if="${#strings.startsWith(tag.tagName, '投资摘要:')}"
                       th:text="${#strings.substringAfter(tag.tagName, '投资摘要:')}">
                        该客户是典型的成长风格投资者...
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- 交易记录 -->
    <div class="card">
        <div class="card-header fw-bold">近期交易记录</div>
        <div class="card-body">
            <table class="table table-sm">
                <thead>
                <tr>
                    <th>日期</th>
                    <th>类型</th>
                    <th>基金名称</th>
                    <th>金额</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="tx : ${customer.transactions}">
                    <td th:text="${tx.transactionDate}"></td>
                    <td>
                        <span th:if="${tx.transactionType == 'BUY'}" class="badge bg-danger">买入</span>
                        <span th:if="${tx.transactionType == 'SELL'}" class="badge bg-success">卖出</span>
                    </td>
                    <td th:text="${tx.fundName}"></td>
                    <td th:text="${#numbers.formatDecimal(tx.transactionAmount, 1, 'COMMA', 2, 'POINT')}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
