<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>客户列表</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>客户列表</h1>
        <a href="/customers/new" class="btn btn-primary">添加新客户</a>
    </div>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>客户编号</th>
            <th>姓名</th>
            <th>年收入(万)</th>
            <th>总资产(万)</th>
            <th>投资经验(年)</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="customer : ${customers}">
            <td th:text="${customer.customerNo}">CUST001</td>
            <td th:text="${customer.name}">张三</td>
            <td th:text="${customer.annualIncome}">50</td>
            <td th:text="${customer.assetScale}">200</td>
            <td th:text="${customer.investmentExperience}">5</td>
            <td>
                <a th:href="@{/customers/profile/{id}(id=${customer.id})}" class="btn btn-info btn-sm">查看画像</a>
                <a th:href="@{/customers/edit/{id}(id=${customer.id})}" class="btn btn-warning btn-sm">编辑</a>
                <a th:href="@{/customers/delete/{id}(id=${customer.id})}" class="btn btn-danger btn-sm" onclick="return confirm('确定要删除吗？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
