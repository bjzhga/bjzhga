<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>客户信息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 th:if="${customer.id == null}">添加新客户</h1>
    <h1 th:if="${customer.id != null}">编辑客户信息</h1>

    <form action="#" th:action="${customer.id == null} ? @{/customers} : @{/customers/{id}(id=${customer.id})}" th:object="${customer}" method="post">
        <div class="mb-3">
            <label for="customerNo" class="form-label">客户编号</label>
            <input type="text" class="form-control" id="customerNo" th:field="*{customerNo}" required>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">姓名</label>
            <input type="text" class="form-control" id="name" th:field="*{name}" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">手机号</label>
            <input type="text" class="form-control" id="phone" th:field="*{phone}">
        </div>
        <div class="mb-3">
            <label for="annualIncome" class="form-label">年收入 (万元)</label>
            <input type="number" step="0.01" class="form-control" id="annualIncome" th:field="*{annualIncome}">
        </div>
        <div class="mb-3">
            <label for="assetScale" class="form-label">总资产规模 (万元)</label>
            <input type="number" step="0.01" class="form-control" id="assetScale" th:field="*{assetScale}">
        </div>
        <div class="mb-3">
            <label for="investmentExperience" class="form-label">金融投资经验 (年)</label>
            <input type="number" class="form-control" id="investmentExperience" th:field="*{investmentExperience}">
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/customers" class="btn btn-secondary">取消</a>
    </form>
</div>
</body>
</html>
